name: Build HisabPro Pro APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'
      - name: Generate Project and Keystore
        run: |
          python3 -c '
          import base64, json, lzma
          from pathlib import Path
          b64 = ""
          files = json.loads(lzma.decompress(base64.b64decode(b64)).decode("utf-8"))
          for k, v in files.items():
              p = Path(k)
              p.parent.mkdir(parents=True, exist_ok=True)
              p.write_text(v, encoding="utf-8")
          '
          mkdir -p app/keystore
          keytool -genkeypair -v -keystore app/keystore/hisabpro-release-key.jks -keyalg RSA -keysize 2048 -validity 10000 -alias hisabpro_release -storepass "HisabPro2026!" -keypass "HisabPro2026!" -dname "CN=HisabPro Pro, O=HisabPro, C=IN"
      - name: Build Signed Release APK
        run: gradle assembleRelease
      - name: Upload HisabPro-Pro-release.apk
        uses: actions/upload-artifact@v4
        with:
          name: HisabPro-Pro-release-APK
          path: app/build/outputs/apk/release/*.apk
